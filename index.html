<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой кабинет — CRM</title>
<meta name="theme-color" content="#c2577a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fbf6f8;--card:#fff;--ink:#2d2328;--muted:#8d7f86;--line:#efe3e8;--accent:#c2577a;--accent2:#a8436a;--soft:#f8e6ee;--ok:#2f9466;--oksoft:#e3f4ec;--warn:#c9821f;--warnsoft:#fbf0dc;--bad:#c94a4a;--badsoft:#fae5e5;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0}
header .sub{color:var(--muted);font-size:13px}
main{padding:12px 16px;max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--accent);font-weight:600}
nav .badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-size:22px;font-weight:700}
h2{font-size:17px;margin:18px 0 8px}
h3{font-size:15px;margin:14px 0 6px}
.btn{border:0;border-radius:11px;padding:10px 14px;font-size:15px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{background:var(--accent2)}
.btn.ghost{background:var(--soft);color:var(--accent2)}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--badsoft);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1 1 auto}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:6;width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;box-shadow:0 6px 18px rgba(194,87,122,.35)}
input,select,textarea{width:100%;font:inherit;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--accent2);font-weight:600}
.tag.ok{background:var(--oksoft);color:var(--ok)}
.tag.warn{background:var(--warnsoft);color:var(--warn)}
.tag.bad{background:var(--badsoft);color:var(--bad)}
.tag.grey{background:#eee;color:#777}
.alert{background:var(--badsoft);color:var(--bad);border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.note{background:var(--warnsoft);color:#7a5414;border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0 12px}
.week button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 0;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.week button .d{font-size:17px;font-weight:700}
.week button .w{font-size:11px;color:var(--muted)}
.week button .dots{height:6px;font-size:9px;line-height:6px;color:var(--accent)}
.week button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.week button.on .w,.week button.on .dots{color:#fff}
.week button.today{border-color:var(--accent)}
.week button.off{background:#f2eef0}
.slot{display:block;width:100%;text-align:left;border:1.5px dashed #e3c9d4;background:transparent;color:var(--accent2);border-radius:12px;padding:9px 12px;margin:0 0 10px;font:inherit;font-size:14px}
.visit{display:flex;gap:12px;cursor:pointer}
.visit .t{min-width:52px;font-weight:700}
.visit .t .e{font-weight:400;color:var(--muted);font-size:12px}
.visit.done{border-left:4px solid var(--ok)}
.visit.planned{border-left:4px solid var(--accent)}
.visit.noshow,.visit.cancelled{opacity:.55;border-left:4px solid #bbb}
.list .item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .v{font-size:20px;font-weight:700}
.kpi .l{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.bars .col{width:100%;display:flex;gap:2px;align-items:flex-end;flex:1}
.bars .col i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars .col i.x{background:#e6c3cf}
.hbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.hbar i{display:block;height:100%;background:var(--accent)}
.chk{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.chk .p{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:13px}
#sheetBg{position:fixed;inset:0;background:rgba(40,20,30,.4);z-index:20;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom));display:none;max-width:720px;margin:0 auto}
#sheet .grab{width:40px;height:5px;background:#ddd;border-radius:3px;margin:4px auto 8px}
#sheet .shead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-8px;background:var(--bg);padding:6px 0;z-index:2}
#sheet .shead h2{margin:0}
.x{border:0;background:var(--soft);color:var(--accent2);width:34px;height:34px;border-radius:50%;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d2328;color:#fff;padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;display:none;max-width:90vw;text-align:center}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
#lock input{max-width:220px;text-align:center;font-size:24px;letter-spacing:6px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:3px;margin:6px 0 10px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:9px;font:inherit;font-size:14px;color:var(--accent2)}
.seg button.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
a{color:var(--accent2)}
.menu .item{font-size:16px}
</style>
</head>
<body>
<header>
  <div><h1 id="title">Записи</h1><div class="sub" id="subtitle"></div></div>
  <div id="hdrBtn"></div>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-t="cal"><span class="i">📅</span>Записи</button>
  <button data-t="clients"><span class="i">👩</span>Клиенты</button>
  <button data-t="remind"><span class="i">🔔</span>Напомнить<span class="badge" id="rbadge" style="display:none"></span></button>
  <button data-t="stats"><span class="i">📊</span>Итоги</button>
  <button data-t="more"><span class="i">⚙️</span>Ещё</button>
</nav>
<div id="sheetBg" onclick="closeSheet()"></div>
<div id="sheet"></div>
<div id="toast"></div>
<div id="lock">
  <div style="font-size:40px">🔒</div>
  <div>Введите PIN-код</div>
  <input id="lockIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
  <button class="btn" onclick="tryUnlock()">Открыть</button>
</div>

<script>
'use strict';
/* ===================== ДАННЫЕ ===================== */
const KEY = 'crm_depil_v1';
const DEF_SERVICES = [
  ['Подмышки', 3000, 20, 28], ['Бикини классическое', 5000, 30, 28], ['Глубокое бикини', 8000, 45, 28],
  ['Голени', 5000, 30, 28], ['Ноги полностью', 9000, 60, 28], ['Руки до локтя', 3500, 25, 28],
  ['Руки полностью', 5000, 40, 28], ['Верхняя губа', 1500, 10, 21], ['Живот (полоска)', 1500, 10, 28],
  ['Комплекс: глуб. бикини + подмышки + ноги', 17000, 90, 28]
];
const EXP_CATS = ['Паста / сахар', 'Воск', 'Расходники', 'Аренда', 'Реклама', 'Обучение', 'Другое'];
const SOURCES = ['Сарафан (подруга)', 'Instagram', 'ВКонтакте', 'Telegram', 'Авито', 'Яндекс/2ГИС карты', 'Онлайн-запись', 'Другое'];
const METHODS = ['Шугаринг', 'Воск', 'Другое'];
const DEF_TPL = {
  tplVisit: 'Здравствуйте, {имя}! 🌸 Напоминаю, что вы записаны на {дата} в {время} ({услуги}). Жду вас! Если планы изменились — напишите, пожалуйста.',
  tplRepeat: 'Здравствуйте, {имя}! 🌸 Прошло уже {недель} нед. с последней процедуры — самое время обновить. Подобрать вам удобное окошко?',
  tplLost: 'Здравствуйте, {имя}! 🌸 Давно не виделись. Буду рада видеть вас снова — для вас скидка 10% на следующий визит. Записать?',
  tplBirthday: 'Здравствуйте, {имя}! 🎉 Поздравляю с днём рождения! В подарок — скидка 15% на процедуру в течение месяца 🌸'
};
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function defaultDb() {
  return {
    v: 1,
    settings: Object.assign({ master: '', phone: '', tg: '', address: '', workStart: '10:00', workEnd: '20:00', step: 30,
      workDays: [1, 2, 3, 4, 5, 6], lostDays: 60, defaultRepeat: 28, bookDays: 14, pin: '', lastBackup: '' }, DEF_TPL),
    services: DEF_SERVICES.map(([name, price, dur, rep]) => ({ id: uid(), name, price, dur, rep, active: true })),
    clients: [], visits: [], expenses: [], daysOff: []
  };
}
let db;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); const def = defaultDb(); d.settings = Object.assign(def.settings, d.settings || {});
      ['services', 'clients', 'visits', 'expenses', 'daysOff'].forEach(k => { if (!Array.isArray(d[k])) d[k] = def[k]; });
      if (!d.visits.length && d.services.some(s => s.name === 'Подмышки' && s.price === 800)) { // старые цены в рублях → тенге
        const np = Object.fromEntries(DEF_SERVICES.map(x => [x[0], x[1]])); d.services.forEach(s => { if (np[s.name]) s.price = np[s.name]; }); }
      return d; }
  } catch (e) { console.error(e); }
  return defaultDb();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { alert('Не удалось сохранить данные! Сделайте резервную копию. ' + e.message); }
}
db = load();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ===================== ПОМОЩНИКИ ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ds(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const DOW = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONN = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
const MONS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const fmtD = s => { const d = pd(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const fmtDW = s => DOW[pd(s).getDay()] + ', ' + fmtD(s);
const t2m = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const m2t = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const money = n => (Math.round(Number(n) || 0)).toLocaleString('ru-RU') + ' ₸';
const num = v => { const n = parseFloat(String(v).replace(',', '.').replace(/\s/g, '')); return isNaN(n) ? 0 : n; };
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2600); }
function plural(n, a, b, c) { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }

const cById = id => db.clients.find(c => c.id === id);
const sById = id => db.services.find(s => s.id === id);
const byDT = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);
const visitsOf = cid => db.visits.filter(v => v.clientId === cid).sort(byDT);
const lastDone = cid => { const l = visitsOf(cid).filter(v => v.status === 'done'); return l[l.length - 1]; };
const nextPlanned = cid => visitsOf(cid).find(v => v.status === 'planned' && v.date >= today());
function repeatFor(v) { const r = (v.services || []).map(id => sById(id)?.rep).filter(Boolean); return r.length ? Math.min(...r) : (db.settings.defaultRepeat || 28); }
function firstName(c) { return (c?.name || '').trim().split(/\s+/)[0] || ''; }
function normPhone(p) { let d = String(p || '').replace(/\D/g, ''); if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1); if (d.length === 10) d = '7' + d; return d; }
function waLink(phone, text) { return 'https://wa.me/' + normPhone(phone) + (text ? '?text=' + encodeURIComponent(text) : ''); }
function tgLink(tg) { return 'https://t.me/' + String(tg || '').replace(/^@/, '').replace(/^https?:\/\/t\.me\//, ''); }
function fillTpl(tpl, c, v) {
  const vars = { 'имя': firstName(c), 'дата': v ? fmtDW(v.date) : '', 'время': v ? v.time : '', 'услуги': v ? v.title : '',
    'мастер': db.settings.master, 'адрес': db.settings.address,
    'недель': (() => { const l = lastDone(c?.id); return l ? Math.max(1, Math.round(diffDays(l.date, today()) / 7)) : ''; })() };
  return String(tpl || '').replace(/\{([а-яёa-z]+)\}/gi, (m, k) => vars[k.toLowerCase()] ?? m);
}
function openUrl(u) { window.open(u, '_blank'); }
function writeTo(cid, text) {
  const c = cById(cid); if (!c) return;
  if (c.phone) openUrl(waLink(c.phone, text));
  else if (c.tg) { copyText(text); openUrl(tgLink(c.tg)); toast('Текст скопирован — вставьте его в чат'); }
  else { copyText(text); toast('У клиента нет телефона. Текст скопирован.'); }
}
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).catch(() => fallbackCopy(t)); else fallbackCopy(t);
}
function fallbackCopy(t) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); }
function medFlags(c) { return (c.allergies || '').trim() || (c.contra || '').trim(); }
function clientOptions(sel) {
  return db.clients.slice().sort((a, b) => a.name.localeCompare(b.name, 'ru'))
    .map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}${c.phone ? ' · ' + esc(c.phone) : ''}</option>`).join('');
}

/* ===================== ИНТЕРФЕЙС ===================== */
const ui = { tab: 'cal', day: today(), q: '', month: today().slice(0, 7) };
function openSheet(title, html) {
  $('sheet').innerHTML = `<div class="grab"></div><div class="shead"><h2>${title}</h2><button class="x" onclick="closeSheet()">✕</button></div>${html}`;
  $('sheet').style.display = 'block'; $('sheetBg').style.display = 'block'; $('sheet').scrollTop = 0;
}
function closeSheet() { $('sheet').style.display = 'none'; $('sheetBg').style.display = 'none'; }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { ui.tab = b.dataset.t; closeSheet(); render(); window.scrollTo(0, 0); });

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === ui.tab));
  const n = remindCount(); $('rbadge').style.display = n ? 'block' : 'none'; $('rbadge').textContent = n;
  $('hdrBtn').innerHTML = '';
  $('app').innerHTML = VIEWS[ui.tab]();
}
const VIEWS = {};

/* ---------- ЗАПИСИ (календарь) ---------- */
VIEWS.cal = () => {
  const s = db.settings, d = ui.day, t = today();
  $('title').textContent = 'Записи';
  const mon = addDays(d, -((pd(d).getDay() + 6) % 7));
  $('subtitle').textContent = MONN[pd(mon).getMonth()] + ' ' + pd(mon).getFullYear();
  $('hdrBtn').innerHTML = `<button class="btn sm ghost" onclick="pasteRequest()">📋 Заявка</button>`;
  let h = '';
  if (!db.clients.length && !db.visits.length) {
    h += `<div class="card"><b>👋 Добро пожаловать!</b><div class="small muted" style="margin-top:4px">Начните с раздела «Ещё → Настройки»: имя, телефон WhatsApp и рабочее время. Потом добавьте клиентов (можно списком) и записи.</div>
    <div class="btns"><button class="btn ghost sm" onclick="ui.tab='more';render();openSettings()">Настройки</button><button class="btn line sm" onclick="loadDemo()">Показать пример</button></div></div>`;
  } else if (!s.lastBackup || diffDays(s.lastBackup, t) >= 7) {
    h += `<div class="note">💾 ${s.lastBackup ? 'Резервная копия делалась ' + fmtD(s.lastBackup) : 'Резервная копия ещё не делалась'}. <a href="#" onclick="exportBackup();return false"><b>Сохранить сейчас</b></a></div>`;
  }
  h += `<div class="row between"><button class="btn sm line" onclick="ui.day=addDays(ui.day,-7);render()">‹ Неделя</button>
    <button class="btn sm ghost" onclick="ui.day=today();render()">Сегодня</button>
    <button class="btn sm line" onclick="ui.day=addDays(ui.day,7);render()">Неделя ›</button></div><div class="week">`;
  for (let i = 0; i < 7; i++) {
    const x = addDays(mon, i), cnt = db.visits.filter(v => v.date === x && v.status !== 'cancelled').length;
    const off = isOff(x);
    h += `<button class="${x === d ? 'on' : ''} ${x === t ? 'today' : ''} ${off ? 'off' : ''}" onclick="ui.day='${x}';render()"><span class="w">${DOW[pd(x).getDay()]}</span><span class="d">${pd(x).getDate()}</span><span class="dots">${'●'.repeat(Math.min(cnt, 4))}</span></button>`;
  }
  h += '</div>';
  const vs = db.visits.filter(v => v.date === d).sort(byDT);
  const active = vs.filter(v => v.status === 'planned' || v.status === 'done');
  const sum = active.reduce((a, v) => a + (v.status === 'done' ? num(v.paid) : num(v.price)), 0);
  h += `<div class="row between"><h2 style="margin:4px 0 8px">${fmtDW(d)}${d === t ? ' · сегодня' : ''}</h2>
    <button class="btn sm line" onclick="toggleOff('${d}')">${isOff(d) ? '🌿 Выходной' : 'Сделать выходным'}</button></div>`;
  if (active.length) h += `<div class="small muted" style="margin:-4px 0 8px">${active.length} ${plural(active.length, 'запись', 'записи', 'записей')} · ${money(sum)}</div>`;
  if (isOff(d) && !active.length) h += `<div class="empty">🌿 Выходной день</div>`;
  else {
    let cur = t2m(s.workStart); const end = t2m(s.workEnd);
    const gap = (a, b) => b - a >= 30 ? `<button class="slot" onclick="openVisitForm({date:'${d}',time:'${m2t(a)}'})">＋ Свободно ${m2t(a)}–${m2t(b)}</button>` : '';
    for (const v of active) {
      const st = t2m(v.time);
      if (!isOff(d) && st > cur) h += gap(cur, st);
      h += visitCard(v);
      cur = Math.max(cur, st + (v.dur || 30));
    }
    if (!isOff(d) && cur < end) h += gap(cur, end);
  }
  const other = vs.filter(v => v.status === 'cancelled' || v.status === 'noshow');
  if (other.length) h += `<h3 class="muted">Отмены и неявки</h3>` + other.map(visitCard).join('');
  h += `<button class="btn fab" onclick="openVisitForm({date:ui.day})">＋</button>`;
  return h;
};
function isOff(d) { return db.daysOff.includes(d) || !db.settings.workDays.includes(pd(d).getDay()) && !(db.workOn || []).includes(d); }
function toggleOff(d) {
  const wd = db.settings.workDays.includes(pd(d).getDay());
  db.workOn = db.workOn || [];
  if (wd) { db.daysOff = db.daysOff.includes(d) ? db.daysOff.filter(x => x !== d) : db.daysOff.concat(d); }
  else { db.workOn = db.workOn.includes(d) ? db.workOn.filter(x => x !== d) : db.workOn.concat(d); }
  save(); render();
}
const STATUS = { planned: ['Записана', ''], done: ['Выполнено', 'ok'], noshow: ['Не пришла', 'bad'], cancelled: ['Отменена', 'grey'] };
function visitCard(v) {

    <div style="flex:1;min-width:0"><div class="row between"><b>${esc(c.name)}</b>${v.status !== 'planned' ? `<span class="tag ${st[1]}">${st[0]}</span>` : (v.reminded ? '<span class="tag ok">напомнила ✓</span>' : '')}</div>
    <div class="small muted">${esc(v.title)}</div>
    <div class="small"><b>${money(v.status === 'done' ? v.paid : v.price)}</b>${v.method ? ' · ' + esc(v.method) : ''}${medFlags(c) ? ' · <span style="color:var(--bad)">⚠ мед. отметки</span>' : ''}</div></div></div>`;
}

function openVisit(id) {

function suggestNext(v) { let d = addDays(v.date, repeatFor(v)); if (d < today()) d = today(); return d; }

function delVisit(id) { if (!confirm('Удалить запись?')) return; db.visits = db.visits.filter(v => v.id !== id); save(); closeSheet(); render(); }
function remindVisit(id) {

/* ---------- Форма записи ---------- */
function timeOptions(sel) {

  for (let m = 7 * 60; m <= 22 * 60; m += step) h += `<option ${m2t(m) === sel ? 'selected' : ''}>${m2t(m)}</option>`;
  if (sel && t2m(sel) % step) h = `<option selected>${sel}</option>` + h;
  return h;
}
function openVisitForm(o) {

  const svcs = db.services.filter(s => s.active || cur.services.includes(s.id));

    <label>Услуги</label><div id="f_svcs">${svcs.map(s => `<label class="chk"><input type="checkbox" value="${s.id}" ${cur.services.includes(s.id) ? 'checked' : ''} onchange="recalc()"><span>${esc(s.name)}</span><span class="p">${money(s.price)} · ${s.dur} мин</span></label>`).join('')}</div>
    <div class="grid2"><div><label>Цена, ₸</label><input id="f_price" inputmode="decimal" value="${cur.price ?? ''}"></div><div><label>Длительность, мин</label><input id="f_dur" inputmode="numeric" value="${cur.dur ?? ''}"></div></div>

    <label>Комментарий</label><textarea id="f_note" placeholder="Например: первый раз, длина волос 5 мм">${esc(cur.note || '')}</textarea>

  openSheet(v ? 'Изменить запись' : 'Новая запись', h);
  if (!v) recalc(true);
}
function firstFree(d) {
  const s = db.settings; let cur = t2m(s.workStart);
  db.visits.filter(v => v.date === d && (v.status === 'planned' || v.status === 'done')).sort(byDT).forEach(v => { if (t2m(v.time) <= cur + 0) cur = Math.max(cur, t2m(v.time) + (v.dur || 30)); });
  if (d === today()) { const n = new Date(); cur = Math.max(cur, Math.ceil((n.getHours() * 60 + n.getMinutes()) / 30) * 30); }
  return m2t(Math.min(cur, 22 * 60));
}
function recalc(initial) {
  const ids = [...document.querySelectorAll('#f_svcs input:checked')].map(i => i.value);
  const ss = ids.map(sById).filter(Boolean);
  if (!initial || !$('f_price').value) $('f_price').value = ss.length ? ss.reduce((a, s) => a + num(s.price), 0) : '';
  if (!initial || !$('f_dur').value) $('f_dur').value = ss.length ? ss.reduce((a, s) => a + num(s.dur), 0) : '';
}
function saveVisit(id) {
  let cid = $('f_client').value;

    const name = $('f_name').value.trim(); if (!name) return alert('Введите имя клиента');
    const c = { id: uid(), name, phone: $('f_phone').value.trim(), createdAt: today() }; db.clients.push(c); cid = c.id;
  }
  const ids = [...document.querySelectorAll('#f_svcs input:checked')].map(i => i.value);
  if (!ids.length) return alert('Выберите хотя бы одну услугу');
  const date = $('f_date').value, time = $('f_time').value, dur = num($('f_dur').value) || 30;

  const st = t2m(time), en = st + dur;
  const clash = db.visits.find(v => v.id !== id && v.date === date && v.status === 'planned' && t2m(v.time) < en && t2m(v.time) + (v.dur || 30) > st);
  if (clash && !confirm(`Пересекается с записью ${clash.time} (${cById(clash.clientId)?.name || ''}). Всё равно сохранить?`)) return;
  const data = { clientId: cid, date, time, dur, services: ids, title: ids.map(i => sById(i)?.name).filter(Boolean).join(' + '),
    price: num($('f_price').value), method: $('f_method').value, note: $('f_note').value.trim() };
  db.settings.lastMethod = data.method;
  if (id) Object.assign(db.visits.find(v => v.id === id), data);
  else db.visits.push(Object.assign({ id: uid(), status: 'planned', paid: 0, createdAt: today() }, data));
  save(); closeSheet(); ui.day = date; if (ui.tab !== 'clients') ui.tab = 'cal'; render(); toast('Запись сохранена');
}

function pasteRequest() {
  openSheet('Заявка из онлайн-записи', `<div class="small muted">Скопируйте сообщение клиентки из WhatsApp/Telegram целиком и вставьте сюда — запись заполнится сама.</div>
    <textarea id="req" style="min-height:160px;margin-top:8px" placeholder="Вставьте сообщение…"></textarea>
    <div class="btns"><button class="btn wide" onclick="parseRequest()">Разобрать заявку</button></div>`);
}
function parseRequest() {
  const t = $('req').value;
  const m = t.match(/Z\|(\d{4}-\d\d-\d\d)\|(\d\d:\d\d)\|([\w,]*)/);
  if (!m) return alert('Не нашла код записи в сообщении. Скопируйте сообщение целиком (вместе со строкой «код записи»).');
  const name = (t.match(/Имя:\s*(.+)/) || [])[1]?.trim() || 'Клиент';
  const phone = (t.match(/Телефон:\s*(.+)/) || [])[1]?.trim() || '';
  const comment = (t.match(/Комментарий:\s*(.+)/) || [])[1]?.trim() || '';
  let c = phone && db.clients.find(x => normPhone(x.phone) && normPhone(x.phone) === normPhone(phone));
  if (!c) c = db.clients.find(x => x.name.toLowerCase() === name.toLowerCase() && !phone);
  if (!c) { c = { id: uid(), name, phone, source: 'Онлайн-запись', createdAt: today() }; db.clients.push(c); save(); toast('Новый клиент добавлен: ' + name); }
  const services = m[3].split(',').filter(id => sById(id));
  openVisitForm({ clientId: c.id, date: m[1], time: m[2], services });
  if (comment) $('f_note').value = comment;
}

function openBulk() {
  openSheet('Добавить списком', `<div class="small muted">По одной клиентке на строку: имя и телефон. Удобно скопировать из заметок или контактов.<br>Например: <i>Анна Петрова +7 912 345-67-89</i></div>
    <textarea id="bulk" style="min-height:200px;margin-top:8px"></textarea><div class="btns"><button class="btn wide" onclick="saveBulk()">Добавить</button></div>`);
}
function saveBulk() {
  let added = 0, skipped = 0;
  $('bulk').value.split('\n').map(s => s.trim()).filter(Boolean).forEach(line => {
    const pm = line.match(/(\+?\d[\d\s()\-]{8,}\d)/); const phone = pm ? pm[1].trim() : '';
    const name = line.replace(pm ? pm[1] : '', '').replace(/[,;:\-–—]+\s*$/, '').replace(/^\s*[,;:\-–—]+/, '').trim() || phone;
    if (!name) return;
    if (phone && db.clients.find(c => normPhone(c.phone) === normPhone(phone))) { skipped++; return; }
    db.clients.push({ id: uid(), name, phone, createdAt: today() }); added++;
  });
  save(); closeSheet(); render(); toast('Добавлено: ' + added + (skipped ? ', уже были: ' + skipped : ''));
}

/* ---------- НАПОМНИТЬ ---------- */
function dueList() {
  const t = today();
  return db.clients.map(c => {
    const l = lastDone(c.id); if (!l || nextPlanned(c.id)) return null;
    const since = diffDays(l.date, t); if (since > db.settings.lostDays) return null;
    const due = addDays(l.date, repeatFor(l)); if (diffDays(t, due) > 3) return null;
    if (c.remindedAt && c.remindedAt >= l.date && diffDays(c.remindedAt, t) < 10) return null;
    return { c, l, due, since };
  }).filter(Boolean).sort((a, b) => a.due.localeCompare(b.due));
}
function lostList() {
  const t = today();
  return db.clients.map(c => {
    const l = lastDone(c.id); if (!l || nextPlanned(c.id)) return null;
    const since = diffDays(l.date, t); if (since <= db.settings.lostDays) return null;
    if (c.lostMsgAt && diffDays(c.lostMsgAt, t) < 30) return null;
    return { c, l, since };
  }).filter(Boolean).sort((a, b) => a.since - b.since);
}
function bdList() {
  const t = today(), y = pd(t).getFullYear();
  return db.clients.filter(c => c.birthday).map(c => {
    let d = y + c.birthday.slice(4); if (d < t) d = (y + 1) + c.birthday.slice(4);
    return { c, d, in: diffDays(t, d) };
  }).filter(x => x.in <= 7 && !(x.c.bdMsg === x.d)).sort((a, b) => a.in - b.in);
}
function tomorrowList() { const tm = addDays(today(), 1); return db.visits.filter(v => v.date === tm && v.status === 'planned' && !v.reminded).sort(byDT); }
function remindCount() { return tomorrowList().length + dueList().length + bdList().filter(x => x.in <= 1).length; }

/* ---------- ИТОГИ (финансы + аналитика) ---------- */
function monthAdd(m, n) { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function monthName(m) { const [y, mm] = m.split('-').map(Number); return MONN[mm - 1] + ' ' + y; }
function monthStats(m) {
  const vs = db.visits.filter(v => v.date.startsWith(m));
  const done = vs.filter(v => v.status === 'done');
  const rev = done.reduce((a, v) => a + num(v.paid), 0);
  const exp = db.expenses.filter(e => e.date.startsWith(m)).reduce((a, e) => a + num(e.amount), 0);
  const uniq = [...new Set(done.map(v => v.clientId))];
  const firstVisit = {}; db.visits.filter(v => v.status === 'done').sort(byDT).forEach(v => { if (!firstVisit[v.clientId]) firstVisit[v.clientId] = v.date; });
  const newC = uniq.filter(id => (firstVisit[id] || '').startsWith(m)).length;
  return { vs, done, rev, exp, uniq, newC, ret: uniq.length - newC, noshow: vs.filter(v => v.status === 'noshow').length, cancel: vs.filter(v => v.status === 'cancelled').length };
}

  const cat = {}; ex.forEach(e => cat[e.cat] = (cat[e.cat] || 0) + num(e.amount));

  h += ex.length ? `<div class="card list">${ex.map(e => `<div class="item" onclick="openExpense('${e.id}')"><div><b>${esc(e.cat)}</b><div class="small muted">${fmtD(e.date)}${e.note ? ' · ' + esc(e.note) : ''}</div></div><b>${money(e.amount)}</b></div>`).join('')}</div>` : `<div class="muted small">Расходов в этом месяце нет. Записывайте покупки воска, пасты, расходников — так будет видна реальная прибыль.</div>`;
  return h;
};

/* ---------- Онлайн-запись ---------- */
function cut(ints, a, b) { const r = []; ints.forEach(([x, y]) => { if (b <= x || a >= y) r.push([x, y]); else { if (a > x) r.push([x, a]); if (b < y) r.push([b, y]); } }); return r; }
function freeSlots(days) {
  const s = db.settings, t = today(), res = []; const n = new Date(); const nowM = n.getHours() * 60 + n.getMinutes();
  for (let i = 0; i < days; i++) {
    const d = addDays(t, i); if (isOff(d)) continue;
    let free = [[t2m(s.workStart), t2m(s.workEnd)]];
    if (i === 0) free = cut(free, 0, Math.ceil((nowM + 60) / 30) * 30);
    db.visits.filter(v => v.date === d && (v.status === 'planned' || v.status === 'done')).forEach(v => { free = cut(free, t2m(v.time), t2m(v.time) + (v.dur || 30)); });
    free = free.filter(([a, b]) => b - a >= 15);
    if (free.length) res.push([d, free]);
  }
  return res;
}
function b64e(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function bookingLink() {
  const s = db.settings;
  const payload = { m: s.master, p: normPhone(s.phone), t: s.tg.replace(/^@/, ''), a: s.address, g: today(), st: s.step || 30,
    s: db.services.filter(x => x.active).map(x => [x.id, x.name, x.price, x.dur]), f: freeSlots(s.bookDays || 14) };
  return new URL('zapis.html', location.href).href + '#' + b64e(JSON.stringify(payload));
}

    ${local ? '<div class="note">⚠ Сейчас CRM открыта с компьютера/локально — у клиенток такая ссылка не откроется. Пользуйтесь онлайн-записью из версии на GitHub Pages (см. инструкцию).</div>' : ''}
    <label>Показывать дней вперёд</label><select id="bdays" onchange="db.settings.bookDays=+this.value;save();openBooking()">${[7, 14, 21, 30].map(x => `<option ${x == (s.bookDays || 14) ? 'selected' : ''}>${x}</option>`).join('')}</select>

    <div class="btns"><button class="btn" onclick="shareBooking()">📤 Поделиться ссылкой</button><button class="btn line" onclick="copyText(bookingLink());toast('Ссылка скопирована')">Копировать</button></div>
    <div class="btns"><a class="btn ghost" href="${esc(link)}" target="_blank">Посмотреть, как видит клиент</a></div>`);

async function shareBooking() {
  const url = bookingLink(), text = 'Запишитесь онлайн — свободные окошки здесь 🌸';
  if (navigator.share) { try { await navigator.share({ title: 'Онлайн-запись', text, url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  copyText(text + '\n' + url); toast('Ссылка скопирована — вставьте её в сторис, профиль или чат');
}

function openBackup() {
  openSheet('Резервная копия', `<div class="small">Все данные хранятся <b>только в этом телефоне</b>, в браузере. Если очистить данные браузера или потерять телефон — без копии они пропадут.<br><br>
    Раз в неделю нажимайте «Сохранить копию» и отправляйте файл себе в Telegram («Избранное») или на Google Диск.</div>
    <div class="btns"><button class="btn" onclick="exportBackup()">💾 Сохранить копию</button></div>
    <h3>Восстановить из копии</h3><div class="small muted">Выберите файл crm-depil-….json. Текущие данные будут заменены.</div>
    <input type="file" id="impf" accept=".json,.txt,application/json,text/plain" style="margin-top:8px" onchange="importBackup(this.files[0])">
    <h3>Таблица клиентов</h3><div class="btns"><button class="btn line sm" onclick="exportCsv()">Скачать клиентов (Excel/CSV)</button></div>`);
}
function markBackup() { db.settings.lastBackup = today(); save(); render(); toast('Копия сохранена'); }
async function exportBackup() {
  const data = JSON.stringify(db), name = 'crm-depil-' + today() + '.json';
  for (const type of ['application/json', 'text/plain']) {
    const file = new File([data], type === 'text/plain' ? name.replace('.json', '.txt') : name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Копия CRM ' + today() }); markBackup(); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); markBackup();
}
function importBackup(f) {
  if (!f) return; const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.clients) || !Array.isArray(d.visits)) throw new Error('это не файл копии CRM');
      if (!confirm(`В копии: ${d.clients.length} клиентов, ${d.visits.length} записей. Заменить текущие данные?`)) return;
      localStorage.setItem(KEY, JSON.stringify(d)); db = load(); save(); closeSheet(); render(); toast('Данные восстановлены');
    } catch (e) { alert('Не получилось прочитать файл: ' + e.message); }
  };
  r.readAsText(f);
}
function exportCsv() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Имя', 'Телефон', 'Telegram', 'День рождения', 'Источник', 'Кожа', 'Волосы', 'Противопоказания', 'Аллергии', 'Заметки', 'Визитов', 'Последний визит', 'Потратила']];
  db.clients.forEach(c => { const d = db.visits.filter(v => v.clientId === c.id && v.status === 'done'); const l = lastDone(c.id);
    rows.push([c.name, c.phone, c.tg, c.birthday, c.source, c.skin, c.hair, c.contra, c.allergies, c.notes, d.length, l ? l.date : '', d.reduce((a, v) => a + num(v.paid), 0)]); });
  const csv = '\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'клиенты-' + today() + '.csv'; a.click();
}

/* ---------- PIN ---------- */
function hash(s) { let h = 5381; for (const ch of 'depil:' + s) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return String(h); }
function openPin() {
  openSheet('PIN-код', `<div class="small">PIN закрывает CRM от чужих глаз, если телефон возьмёт кто-то другой. Запрашивается при открытии и после 5 минут без дела.</div>
    <label>Новый PIN (4–8 цифр)</label><input id="pin1" type="password" inputmode="numeric" maxlength="8">
    <div class="btns"><button class="btn" onclick="setPin()">Установить</button>${db.settings.pin ? '<button class="btn bad" onclick="db.settings.pin=\'\';save();closeSheet();render();toast(\'PIN выключен\')">Выключить PIN</button>' : ''}</div>`);
}
function setPin() { const p = $('pin1').value.trim(); if (!/^\d{4,8}$/.test(p)) return alert('PIN — от 4 до 8 цифр'); db.settings.pin = hash(p); save(); closeSheet(); render(); toast('PIN установлен. Не забудьте его!'); }
function lock() { if (!db.settings.pin) return; $('lock').style.display = 'flex'; $('lockIn').value = ''; setTimeout(() => $('lockIn').focus(), 100); }
function tryUnlock() { if (hash($('lockIn').value) === db.settings.pin) $('lock').style.display = 'none'; else { $('lockIn').value = ''; toast('Неверный PIN'); } }
$('lockIn').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else { if (hiddenAt && Date.now() - hiddenAt > 5 * 60e3) lock(); if (ui.tab !== 'more' && $('sheet').style.display !== 'block') render(); }
});
