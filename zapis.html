<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Онлайн-запись</title>
<meta name="theme-color" content="#c2577a">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#fbf6f8;--ink:#2d2328;--muted:#8d7f86;--line:#efe3e8;--accent:#c2577a;--soft:#f8e6ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.hero{text-align:center;margin-bottom:14px}
.hero .ic{font-size:40px}
.hero h1{font-size:21px;margin:4px 0 2px}
.muted{color:var(--muted)}.small{font-size:13px}
h2{font-size:16px;margin:20px 0 8px}
h2 .n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:13px;margin-right:6px}
.chk{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fff;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.chk .p{margin-left:auto;white-space:nowrap;font-weight:600}
.chk .p small{display:block;font-weight:400;color:var(--muted);text-align:right}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.days button{flex:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 11px;font:inherit;color:var(--ink);text-align:center;min-width:62px}
.days button b{display:block;font-size:17px}
.days button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.times button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font:inherit;font-weight:600;color:var(--ink)}
.times button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:8px;color:var(--ink)}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border:0;border-radius:13px;padding:14px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--accent);margin-top:8px;cursor:pointer;text-decoration:none}
.btn.wa{background:#25a35a}.btn.tg{background:#2a9bd8}
.btn:disabled{opacity:.4}
.sum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2d2328;color:#fff;padding:10px 16px;border-radius:12px;display:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const ds = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const m2t = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const DOW = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const money = n => (Math.round(+n || 0)).toLocaleString('ru-RU') + ' ₸';
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3500); }

let P = null;
try {
  let h = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/'); while (h.length % 4) h += '=';
  P = JSON.parse(decodeURIComponent(escape(atob(h))));
} catch (e) { P = null; }

const st = { sel: [], day: null, time: null };
const svc = id => P.s.find(x => x[0] === id);
const totalDur = () => st.sel.reduce((a, id) => a + (+svc(id)[3] || 0), 0) || 30;
const totalPrice = () => st.sel.reduce((a, id) => a + (+svc(id)[2] || 0), 0);

function times(day) {
  const now = new Date(), isToday = day[0] === ds(now), nowM = now.getHours() * 60 + now.getMinutes() + 60;
  const dur = totalDur(), step = P.st || 30, out = [];
  day[1].forEach(([a, b]) => { for (let t = Math.ceil(a / step) * step; t + dur <= b; t += step) if (!isToday || t >= nowM) out.push(t); });
  return out;
}
function days() { const t = ds(new Date()); return (P.f || []).filter(d => d[0] >= t && times(d).length); }

function render() {
  if (!P) { $('app').innerHTML = '<div class="empty">😔 Ссылка повреждена.<br>Попросите мастера прислать её ещё раз.</div>'; return; }
  const D = days();
  if (st.day && !D.find(d => d[0] === st.day)) st.day = null;
  if (!st.day && D.length) st.day = D[0][0];
  const day = D.find(d => d[0] === st.day);
  const T = day ? times(day) : [];
  if (!T.includes(st.time)) st.time = null;
  let h = `<div class="hero"><div class="ic">🌸</div><h1>${esc(P.m || 'Онлайн-запись')}</h1><div class="muted small">${P.a ? '📍 ' + esc(P.a) : 'Запись на депиляцию'}</div></div>`;
  h += `<h2><span class="n">1</span>Выберите услуги</h2>` + P.s.map(([id, name, price, dur]) => `<label class="chk"><input type="checkbox" ${st.sel.includes(id) ? 'checked' : ''} onchange="tog('${esc(id)}')"><span>${esc(name)}</span><span class="p">${money(price)}<small>${dur} мин</small></span></label>`).join('');
  if (st.sel.length) h += `<div class="sum">Итого: <b>${money(totalPrice())}</b> · примерно ${totalDur()} мин</div>`;
  h += `<h2><span class="n">2</span>Выберите день и время</h2>`;
  if (!D.length) h += `<div class="empty">Свободных окошек${st.sel.length ? ' на такую длительность' : ''} в ближайшие дни нет.<br>Напишите мастеру напрямую — постараемся найти время.</div>`;
  else {
    h += `<div class="days">${D.map(([d]) => `<button class="${d === st.day ? 'on' : ''}" onclick="st.day='${d}';st.time=null;render()">${DOW[pd(d).getDay()]}<b>${pd(d).getDate()}</b><span class="small">${MON[pd(d).getMonth()].slice(0, 3)}</span></button>`).join('')}</div>`;
    h += `<div class="times" style="margin-top:8px">${T.map(t => `<button class="${t === st.time ? 'on' : ''}" onclick="st.time=${t};render()">${m2t(t)}</button>`).join('')}</div>`;
  }
  h += `<h2><span class="n">3</span>Ваши данные</h2>
    <input id="nm" placeholder="Имя" value="${esc(st.nm || '')}" oninput="st.nm=this.value">
    <input id="ph" type="tel" placeholder="Телефон" value="${esc(st.ph || '')}" oninput="st.ph=this.value">
    <textarea id="cm" rows="2" placeholder="Комментарий (необязательно)" oninput="st.cm=this.value">${esc(st.cm || '')}</textarea>`;
  const ok = st.sel.length && st.day && st.time != null;
  if (P.p) h += `<button class="btn wa" ${ok ? '' : 'disabled'} onclick="send('wa')">Отправить заявку в WhatsApp</button>`;
  if (P.t) h += `<button class="btn tg" ${ok ? '' : 'disabled'} onclick="send('tg')">Отправить в Telegram</button>`;
  if (!ok) h += `<div class="muted small" style="text-align:center;margin-top:8px">Выберите услугу, день и время</div>`;
  h += `<div class="muted small" style="text-align:center;margin-top:16px">Мастер подтвердит запись в ответном сообщении.<br>Окошки актуальны на ${pd(P.g).getDate()} ${MON[pd(P.g).getMonth()]}.</div>`;
  $('app').innerHTML = h;
}
function tog(id) { st.sel = st.sel.includes(id) ? st.sel.filter(x => x !== id) : st.sel.concat(id); render(); }
function message() {
  const d = st.day;
  return `Здравствуйте! Хочу записаться 🌸\nУслуги: ${st.sel.map(id => svc(id)[1]).join(', ')}\nДата: ${DOW[pd(d).getDay()]}, ${pd(d).getDate()} ${MON[pd(d).getMonth()]} в ${m2t(st.time)}\n` +
    `Имя: ${(st.nm || '').trim() || '—'}\nТелефон: ${(st.ph || '').trim() || '—'}\n` + ((st.cm || '').trim() ? `Комментарий: ${st.cm.trim().replace(/\n/g, ' ')}\n` : '') +
    `(код записи: Z|${d}|${m2t(st.time)}|${st.sel.join(',')})`;
}
function send(kind) {
  if (!(st.nm || '').trim()) { toast('Напишите, пожалуйста, ваше имя'); $('nm').focus(); return; }
  const text = message();
  if (kind === 'wa') { location.href = 'https://wa.me/' + P.p + '?text=' + encodeURIComponent(text); return; }
  const done = () => { toast('Текст заявки скопирован — вставьте его в чат и отправьте'); setTimeout(() => location.href = 'https://t.me/' + P.t, 1200); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => { prompt('Скопируйте текст и отправьте мастеру:', text); location.href = 'https://t.me/' + P.t; });
  else { prompt('Скопируйте текст и отправьте мастеру:', text); location.href = 'https://t.me/' + P.t; }
}
render();
</script>
</body>
</html>
